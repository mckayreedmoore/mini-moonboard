<text x="35" y="61" font-size="14">FRONT / CLIMBING FACE: measure right from LEFT edge and up from BOTTOM edge; do not mirror.</text>
<text x="35" y="105" font-size="13">Development layout: 12 screws on this panel; count does not establish resistance.</text>
<text x="35" y="132" font-size="13">Coordinates below are panel-local millimeters. Drill axis is perpendicular to the panel.</text>
<text x="35" y="159" font-size="13">SPAX XFT08P-2000 #8 x 2 inch: nominal 90-degree included head angle, 8.128 mm head diameter.</text>
<text x="35" y="186" font-size="13">Set a flush seat using the actual screw and a matched tool on an offcut; do not overdrive.</text>
<text x="35" y="213" font-size="13">No full-shank pilot diameter or countersink machining depth is specified here.</text>
<text x="35" y="240" font-size="13">Reference: docs/round-panel-countersink-reference.json (nominal US family drawing).</text>
