<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" role="img" aria-label="SDS through an angle versus Hillman through the plywood">
  <rect width="720" height="240" fill="#f7f4ee"/>
  <text x="20" y="28" font-family="sans-serif" font-size="16" font-weight="700">Two different screws</text>
  <!-- SDS -->
  <text x="40" y="55" font-family="sans-serif" font-size="13" font-weight="700">SDS in an ML24Z angle</text>
  <rect x="40" y="70" width="70" height="70" fill="#c4a574" stroke="#1a1a1a"/>
  <rect x="110" y="70" width="70" height="70" fill="#b08968" stroke="#1a1a1a"/>
  <path d="M100,70 L130,70 L130,100 L100,100 Z" fill="#888" stroke="#1a1a1a"/>
  <line x1="118" y1="55" x2="118" y2="155" stroke="#333" stroke-width="3"/>
  <text x="40" y="160" font-family="sans-serif" font-size="12">Clamp the angle.</text>
  <text x="40" y="178" font-family="sans-serif" font-size="12">Drill 5/32 in through its holes.</text>
  <text x="40" y="196" font-family="sans-serif" font-size="12">Do not layout holes from CAD first.</text>
  <!-- Hillman -->
  <text x="380" y="55" font-family="sans-serif" font-size="13" font-weight="700">Hillman through the plywood</text>
  <rect x="380" y="70" width="18" height="90" fill="#d4c4a8" stroke="#1a1a1a"/>
  <rect x="398" y="70" width="80" height="90" fill="#c4a574" stroke="#1a1a1a"/>
  <line x1="389" y1="50" x2="389" y2="175" stroke="#333" stroke-width="2"/>
  <polygon points="382,70 396,70 389,82" fill="#666"/>
  <text x="380" y="180" font-family="sans-serif" font-size="12">Kobalt #10 bit: 1/8 in pilot,</text>
  <text x="380" y="198" font-family="sans-serif" font-size="12">3/8 in countersink. Scrap first.</text>
  <text x="380" y="216" font-family="sans-serif" font-size="12">Not the SDS bit.</text>
</svg>
