<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Front view: left is A, right is K, pads in front">
  <rect width="640" height="360" fill="#f7f4ee"/>
  <text x="20" y="28" font-family="sans-serif" font-size="16" font-weight="700" fill="#1a1a1a">Standing at the pads, looking at the climbing face</text>
  <!-- pads -->
  <rect x="110" y="250" width="180" height="70" fill="#5b6b8a" stroke="#1a1a1a"/>
  <rect x="290" y="250" width="180" height="70" fill="#7a5a6a" stroke="#1a1a1a"/>
  <text x="155" y="290" font-family="sans-serif" font-size="12" fill="#fff">Pad</text>
  <text x="345" y="290" font-family="sans-serif" font-size="12" fill="#fff">Pad</text>
  <text x="250" y="338" font-family="sans-serif" font-size="12" fill="#333">FRONT (you stand here)</text>
  <!-- board -->
  <polygon points="130,70 450,70 510,240 70,240" fill="#c4a574" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="290" y1="70" x2="290" y2="240" stroke="#1a1a1a" stroke-dasharray="4 3"/>
  <text x="175" y="160" font-family="sans-serif" font-size="18" font-weight="700">A</text>
  <text x="385" y="160" font-family="sans-serif" font-size="18" font-weight="700">K</text>
  <text x="148" y="95" font-family="sans-serif" font-size="12">LEFT</text>
  <text x="400" y="95" font-family="sans-serif" font-size="12">RIGHT</text>
  <!-- legs -->
  <rect x="78" y="200" width="22" height="90" fill="#8b5a2b" stroke="#1a1a1a"/>
  <rect x="480" y="200" width="22" height="90" fill="#8b5a2b" stroke="#1a1a1a"/>
  <text x="500" y="215" font-family="sans-serif" font-size="11">Right leg</text>
  <text x="20" y="215" font-family="sans-serif" font-size="11">Left leg</text>
</svg>
