<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="Side view: kicker, pads, sloped face, rear leg recess">
  <rect width="640" height="300" fill="#f7f4ee"/>
  <text x="20" y="28" font-family="sans-serif" font-size="16" font-weight="700">Side view (right-hand side)</text>
  <!-- floor -->
  <line x1="20" y1="250" x2="620" y2="250" stroke="#1a1a1a" stroke-width="2"/>
  <text x="30" y="270" font-family="sans-serif" font-size="11">FLOOR</text>
  <!-- pad -->
  <rect x="80" y="200" width="160" height="50" fill="#5b6b8a" stroke="#1a1a1a"/>
  <text x="130" y="230" font-family="sans-serif" font-size="12" fill="#fff">5 in pad</text>
  <!-- kicker -->
  <rect x="70" y="155" width="18" height="95" fill="#c4a574" stroke="#1a1a1a"/>
  <text x="20" y="175" font-family="sans-serif" font-size="11">Kicker</text>
  <!-- main face ~40 deg from vertical -->
  <polygon points="88,155 98,155 430,40 418,32" fill="#c4a574" stroke="#1a1a1a"/>
  <text x="250" y="80" font-family="sans-serif" font-size="12">Climbing face</text>
  <!-- rear leg -->
  <polygon points="480,250 510,250 500,70 470,70" fill="#8b5a2b" stroke="#1a1a1a"/>
  <text x="520" y="160" font-family="sans-serif" font-size="12">Rear 4×6 leg</text>
  <!-- 1:12 recess inner face -->
  <polyline points="480,250 495,210 500,70" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="430" y="230" font-family="sans-serif" font-size="11" fill="#c0392b">1:12 recess</text>
  <text x="430" y="246" font-family="sans-serif" font-size="10" fill="#c0392b">inner face of the leg</text>
  <text x="22" y="148" font-family="sans-serif" font-size="11">~150 mm of kicker shows above the pad</text>
</svg>
