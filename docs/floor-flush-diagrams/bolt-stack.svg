<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-label="Bolt stack: head toward the climbing space, nut on the outside">
  <rect width="640" height="220" fill="#f7f4ee"/>
  <text x="20" y="28" font-family="sans-serif" font-size="16" font-weight="700">Every frame bolt</text>
  <!-- wood -->
  <rect x="180" y="70" width="90" height="90" fill="#c4a574" stroke="#1a1a1a"/>
  <rect x="270" y="70" width="90" height="90" fill="#b08968" stroke="#1a1a1a"/>
  <text x="195" y="120" font-family="sans-serif" font-size="11">rim</text>
  <text x="285" y="120" font-family="sans-serif" font-size="11">leg</text>
  <!-- bolt -->
  <rect x="150" y="105" width="28" height="20" fill="#888" stroke="#1a1a1a"/>
  <rect x="178" y="110" width="230" height="10" fill="#aaa" stroke="#1a1a1a"/>
  <polygon points="408,108 428,115 408,122" fill="#666" stroke="#1a1a1a"/>
  <rect x="390" y="102" width="18" height="26" fill="#777" stroke="#1a1a1a"/>
  <text x="40" y="118" font-family="sans-serif" font-size="12">HEAD</text>
  <text x="40" y="134" font-family="sans-serif" font-size="11">toward the</text>
  <text x="40" y="148" font-family="sans-serif" font-size="11">climbing space</text>
  <text x="450" y="118" font-family="sans-serif" font-size="12">NUT + tip</text>
  <text x="450" y="134" font-family="sans-serif" font-size="11">outside, away</text>
  <text x="450" y="148" font-family="sans-serif" font-size="11">from climbers</text>
  <text x="180" y="200" font-family="sans-serif" font-size="12">Washer each side · smooth shank through the wood · threads for the nut only</text>
</svg>
