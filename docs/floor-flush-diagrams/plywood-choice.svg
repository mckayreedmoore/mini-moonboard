<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-label="Bought 4x4 sheets versus a 4x8 cut in half">
  <rect width="720" height="280" fill="#f7f4ee"/>
  <text x="20" y="28" font-family="sans-serif" font-size="16" font-weight="700">How you get the plywood</text>
  <!-- bought -->
  <text x="40" y="58" font-family="sans-serif" font-size="13" font-weight="700">Bought 4×4</text>
  <rect x="40" y="70" width="110" height="110" fill="#d4c4a8" stroke="#1a1a1a"/>
  <rect x="160" y="70" width="110" height="110" fill="#d4c4a8" stroke="#1a1a1a"/>
  <text x="70" y="130" font-family="sans-serif" font-size="12">48 in</text>
  <text x="190" y="130" font-family="sans-serif" font-size="12">48 in</text>
  <text x="40" y="202" font-family="sans-serif" font-size="12">Use the official folder</text>
  <text x="40" y="220" font-family="sans-serif" font-size="11" fill="#444">Full 8 ft wall</text>
  <!-- cut -->
  <text x="380" y="58" font-family="sans-serif" font-size="13" font-weight="700">Cut from 4×8</text>
  <rect x="380" y="70" width="230" height="110" fill="#d4c4a8" stroke="#1a1a1a"/>
  <rect x="488" y="70" width="8" height="110" fill="#c0392b"/>
  <text x="410" y="130" font-family="sans-serif" font-size="12">face</text>
  <text x="530" y="130" font-family="sans-serif" font-size="12">face</text>
  <text x="478" y="55" font-family="sans-serif" font-size="11" fill="#c0392b">kerf</text>
  <text x="380" y="202" font-family="sans-serif" font-size="12">Use the kerf folder</text>
  <text x="380" y="220" font-family="sans-serif" font-size="11" fill="#444">Layout from LEFT; missing 1/8 in on RIGHT (K)</text>
  <text x="380" y="250" font-family="sans-serif" font-size="11" fill="#444">Both faces the same width (each 1/16 in short)</text>
</svg>
