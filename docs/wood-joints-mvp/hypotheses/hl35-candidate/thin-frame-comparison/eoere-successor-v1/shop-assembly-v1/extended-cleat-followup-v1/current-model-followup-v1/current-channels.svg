<text x="440.0000" y="150.0000" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#223044">Radius 6.350 mm; center N8.000 mm; rear depth 14.350 mm</text>
<text x="440.0000" y="190.0000" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#223044">Derived front opening 20.427677 mm (0.804239 in)</text>
<text x="440.0000" y="230.0000" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#223044">These envelopes do not select a saw blade, router or drill bit.</text>
<text x="440.0000" y="270.0000" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#223044">Use the preserved passage routes; no eleven repeated F-column arc cuts.</text>
<text x="80.0000" y="415.0000" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#223044">Reference opening: 20.428 mm</text>
<text x="25.0000" y="490.0000" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#223044">Right principal: retain only its original transverse wire_072_F1_G1 passage and all original bolt bores.</text>
<text x="25.0000" y="537.0000" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#223044">Eleven F-column links run straight beside the principal; their original LED endpoints remain fixed.</text>
<text x="25.0000" y="584.0000" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#223044">Restoring 97,352.067 mm3 changes the finished domain and mass; no old response transfers.</text>
<text x="25.0000" y="631.0000" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#223044">All other base timber passages keep their preceding smaller profiles and source-bound route identities.</text>
<text x="25.0000" y="678.0000" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#223044">Optional-grid lifted cables, extra cuts and provisional midpoint assumptions are outside this shop packet.</text>
<text x="25.0000" y="725.0000" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#223044">Panel screw policy: 1/8-in lead pilot, 3/8-in face countersink, #2 Phillips; CAD screw voids are not bits.</text>
<text x="25.0000" y="772.0000" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#223044">Current outer kicker holes: Z212 mm, 65 mm below the top envelope; use the full screw datum table.</text>
