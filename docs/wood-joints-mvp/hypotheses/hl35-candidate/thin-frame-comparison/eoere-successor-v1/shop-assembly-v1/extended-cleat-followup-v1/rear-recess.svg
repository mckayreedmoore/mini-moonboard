<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760">
<rect width="100%" height="100%" fill="white"/>
<text x="25.0000" y="35.0000" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#223044">Rear leg inner-face recess: full depth plus 1:12 return</text>
<text x="25.0000" y="64.0000" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#223044">Section in L / removal depth d. L is measured along grain from the rear foot heel B.</text>
<polygon points="90.0000,150.0000 90.0000,302.4000 369.5311,302.4000 1078.1911,150.0000" fill="#fff0d9" stroke="#223044" stroke-width="2"/>
<line x1="90.0000" y1="125.0000" x2="90.0000" y2="330.0000" stroke="#223044" stroke-width="1" stroke-dasharray="3 2"/>
<text x="50.0000" y="360.0000" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#223044">Heel B: L0</text>
<line x1="369.5311" y1="125.0000" x2="369.5311" y2="330.0000" stroke="#223044" stroke-width="1" stroke-dasharray="3 2"/>
<text x="329.5311" y="360.0000" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#223044">Full depth ends L180.343</text>
<line x1="1078.1911" y1="125.0000" x2="1078.1911" y2="330.0000" stroke="#223044" stroke-width="1" stroke-dasharray="3 2"/>
<text x="1038.1911" y="360.0000" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#223044">Return ends L637.543</text>
<text x="400.0000" y="103.0000" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#223044">d = 38.100 mm; remaining thickness = 50.800 mm</text>
<text x="600.0000" y="330.0000" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#223044">457.200 mm run / 38.100 mm depth = 12:1</text>
<text x="25.0000" y="410.0000" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#223044">Relief-cut depth stations (nominal; leave positive finishing stock, amount unresolved):</text>
<text x="55.0000" y="445.0000" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#223044">L 180.343: d 38.100</text>
<text x="295.0000" y="445.0000" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#223044">L 294.643: d 28.575</text>
<text x="535.0000" y="445.0000" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#223044">L 408.943: d 19.050</text>
<text x="775.0000" y="445.0000" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#223044">L 523.243: d 9.525</text>
<text x="1015.0000" y="445.0000" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#223044">L 637.543: d 0.000</text>
<text x="25.0000" y="500.0000" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#223044">Left inner face X=-1219.200: remove toward -X. Right inner face X=1216.025: remove toward +X.</text>
<text x="25.0000" y="538.0000" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#223044">The right cutter already carries its -3.175-mm world-X offset. Do not apply that shift a second time.</text>
<text x="25.0000" y="576.0000" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#223044">Z=141.700 sets runner clearance/taper start; do not stop this taper at that height or cut a square shoulder.</text>
<text x="25.0000" y="614.0000" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#223044">Proposed method: supported, depth-controlled relief kerfs, then controlled hand-tool finishing to the plane.</text>
<text x="25.0000" y="652.0000" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#223044">Saw model/depth controls, blade, shoe support, finishing tool and allowed cut error remain required inputs.</text>
<text x="25.0000" y="690.0000" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#223044">This section is a depth definition, not a released jig or permission to cut. Raw foot bevel is a separate cut.</text>
</svg>
