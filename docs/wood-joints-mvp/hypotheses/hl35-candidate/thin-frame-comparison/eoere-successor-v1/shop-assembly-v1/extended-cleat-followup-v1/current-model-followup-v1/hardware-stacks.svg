<text x="25.0000" y="1000.0000" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#223044">W = washer, P = steel flange. Wood bars follow each shaft&#x27;s own receiver order; schematic scale 7 px/mm.</text>
