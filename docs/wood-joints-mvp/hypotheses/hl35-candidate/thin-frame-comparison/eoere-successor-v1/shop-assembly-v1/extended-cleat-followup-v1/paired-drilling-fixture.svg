<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="850" viewBox="0 0 1300 850">
<rect width="100%" height="100%" fill="white"/>
<text x="25.0000" y="35.0000" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#223044">Matched leg/runner and leg/side drilling: fixture requirements</text>
<text x="25.0000" y="64.0000" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#223044">Concept sections along the drill axis; nominal guide/backer sizes are planning choices, not verified tooling.</text>
<text x="25.0000" y="135.0000" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#223044">Lower pair R1/R2: left entry X=-1219.200, drill toward -X</text>
<polygon points="50.0000,170.0000 116.6750,170.0000 116.6750,235.0000 50.0000,235.0000" fill="#edf2f7" stroke="#223044" stroke-width="1"/>
<text x="53.0000" y="196.0000" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#223044">Guide</text>
<text x="53.0000" y="219.0000" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#223044">19.05</text>
<polygon points="116.6750,170.0000 250.0250,170.0000 250.0250,235.0000 116.6750,235.0000" fill="#edf2f7" stroke="#223044" stroke-width="1"/>
<text x="119.6750" y="196.0000" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#223044">Runner</text>
<text x="119.6750" y="219.0000" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#223044">38.10</text>
<polygon points="250.0250,170.0000 427.8250,170.0000 427.8250,235.0000 250.0250,235.0000" fill="#edf2f7" stroke="#223044" stroke-width="1"/>
<text x="253.0250" y="196.0000" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#223044">Recessed leg</text>
<text x="253.0250" y="219.0000" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#223044">50.80</text>
<polygon points="427.8250,170.0000 450.0500,170.0000 450.0500,235.0000 427.8250,235.0000" fill="#edf2f7" stroke="#223044" stroke-width="1"/>
<text x="430.8250" y="160.0000" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#223044">Backer</text>
<text x="430.8250" y="219.0000" font-family="Arial,sans-serif" font-size="10" font-weight="normal" fill="#223044">6.35</text>
<line x1="35.0000" y1="202.5000" x2="475.0500" y2="202.5000" stroke="#9a3140" stroke-width="2"/>
<text x="50.0000" y="269.0000" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#223044">Wood 88.900 mm; guide + wood + 6.35-mm breakout/backer travel = 114.300 mm.</text>
<text x="25.0000" y="325.0000" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#223044">Upper pair U1/U2: left entry X=-1130.300, drill toward -X</text>
<polygon points="50.0000,360.0000 116.6750,360.0000 116.6750,425.0000 50.0000,425.0000" fill="#edf2f7" stroke="#223044" stroke-width="1"/>
<text x="53.0000" y="386.0000" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#223044">Guide</text>
<text x="53.0000" y="409.0000" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#223044">19.05</text>
<polygon points="116.6750,360.0000 427.8250,360.0000 427.8250,425.0000 116.6750,425.0000" fill="#edf2f7" stroke="#223044" stroke-width="1"/>
<text x="119.6750" y="386.0000" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#223044">Side</text>
<text x="119.6750" y="409.0000" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#223044">88.90</text>
<polygon points="427.8250,360.0000 738.9750,360.0000 738.9750,425.0000 427.8250,425.0000" fill="#edf2f7" stroke="#223044" stroke-width="1"/>
<text x="430.8250" y="386.0000" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#223044">Leg</text>
<text x="430.8250" y="409.0000" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#223044">88.90</text>
<polygon points="738.9750,360.0000 761.2000,360.0000 761.2000,425.0000 738.9750,425.0000" fill="#edf2f7" stroke="#223044" stroke-width="1"/>
<text x="741.9750" y="350.0000" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#223044">Backer</text>
<text x="741.9750" y="409.0000" font-family="Arial,sans-serif" font-size="10" font-weight="normal" fill="#223044">6.35</text>
<line x1="35.0000" y1="392.5000" x2="786.2000" y2="392.5000" stroke="#9a3140" stroke-width="2"/>
<text x="50.0000" y="459.0000" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#223044">Wood 177.800 mm; guide + wood + 6.35-mm breakout/backer travel = 203.200 mm.</text>
<text x="25.0000" y="535.0000" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#223044">Locate both members at their finished contact faces and end datums; use positive stops plus separate clamps.</text>
<text x="25.0000" y="571.0000" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#223044">Provide coplanar support to each relevant face. Projected Y/Z overlap does not mean members lie flat together.</text>
<text x="25.0000" y="607.0000" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#223044">Hold one registered two-hole setup between holes. Fit metal bushings to the chosen bit; no steel-angle drilling.</text>
<text x="25.0000" y="643.0000" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#223044">Bit cutting length, free projection below chuck, guide retention and complete chuck/clamp travel must all fit.</text>
<text x="25.0000" y="679.0000" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#223044">An 8-inch overall bit does not establish 203.200-mm upper-stack usable reach. Controlled transfer is a separate route.</text>
<text x="25.0000" y="715.0000" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#223044">Head/nut orientation stays per access-sides.csv. Drilling entry does not reverse the installed bolt.</text>
<text x="25.0000" y="751.0000" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#223044">Upper/lower target coordinates remain in the preserved left-corner sheets, authenticated by current member hashes.</text>
<text x="25.0000" y="787.0000" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#223044">Right member/axis datums are in current CSVs. Left paper sheets are not right-side mirroring instructions.</text>
</svg>
