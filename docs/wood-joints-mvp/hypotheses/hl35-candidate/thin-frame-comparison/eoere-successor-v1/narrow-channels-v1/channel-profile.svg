<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" aria-labelledby="title desc">
<title id="title">Narrowed cable-channel cross-section</title><desc id="desc">A 14 millimetre front opening retains the original 6.35 millimetre rounded rear cap at depth 8. Overall depth is 14.35 millimetres. The recorded maximum harness diameter is 12.7 millimetres.</desc>
