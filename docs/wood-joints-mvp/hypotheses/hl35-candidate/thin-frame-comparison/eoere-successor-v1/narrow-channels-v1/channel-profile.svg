<circle cx="240" cy="191" r="76.2" fill="none" stroke="#137354" stroke-dasharray="5 4"/>
<path d="M 156 85 V 65 H 324 V 85 M 427 95 H 443 V 267.2 H 427" fill="none" stroke="#18232d"/>
<text x="209" y="59" font-size="15">14 mm</text><text x="454" y="182" font-size="15">14.35 mm depth</text>
<text x="454" y="99" font-size="13">Front N0</text><text x="454" y="211" font-size="13">Cap centre N8</text>
<text x="90" y="349" font-size="14">Dashed circle: recorded 12.7 mm maximum harness diameter.</text>
<text x="28" y="376" font-size="13">The 139.7 mm rail continues below this enlarged local detail.</text>
<text x="28" y="398" font-size="13">Nominal geometry; no bit, fit or cutting tolerance is qualified.</text>
<text x="28" y="419" font-size="13">Six central notch-location holds remain. No fabrication release.</text></g></svg>
