<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 510" role="img" aria-labelledby="title desc">
  <title id="title">Knee spine: two proposed bolts through the depth</title>
  <desc id="desc">Two orthographic views of the 276.3 by 38.1 by 139.7 millimetre spine. Four existing bolts cross its width. Two proposed bolts cross its depth at grain stations 100 and 250 millimetres. This diagram shows axis placement only; the current geometry remains unchanged.</desc>
  <style>text{font-family:system-ui,sans-serif;fill:#172b3a}.title{font-size:22px;font-weight:650}.body{font-size:15px}.small{font-size:13px}.wood{fill:#f4e2bf;stroke:#876b40;stroke-width:2}.old{fill:#d7e8f5;stroke:#3678a1;stroke-width:2}.new{fill:none;stroke:#bd531e;stroke-width:3}.dim{stroke:#647888;stroke-width:1;fill:none}.axis{stroke-dasharray:6 4}</style>
  <rect width="920" height="510" fill="#fff"/>
  <text x="40" y="36" class="title">Knee spine · proposed direct bolt bridge</text>
  <text x="40" y="62" class="body">Two added 1/4-in bolts per spine; four added stacks across the frame.</text>
  <text x="80" y="99" class="small">Width-facing view: grain × depth</text>
  <rect x="80" y="110" width="442.08" height="223.52" class="wood"/>
  <circle cx="130.8" cy="262.4" r="6" class="old"/>
  <circle cx="198.08" cy="262.4" r="6" class="old"/>
  <circle cx="386.584885" cy="212.204939" r="6" class="old"/>
  <circle cx="441.740085" cy="165.92423" r="6" class="old"/>
  <path d="M240 110V333.52 M480 110V333.52" class="new axis"/>
  <path d="M219.68 108H260.32 M219.68 335.52H260.32 M459.68 108H500.32 M459.68 335.52H500.32" class="new"/>
  <path d="M80 353H522.08 M80 348V358 M522.08 348V358" class="dim"/>
  <text x="271" y="372" class="small">276.3 mm</text>
  <path d="M61 110V333.52 M56 110H66 M56 333.52H66" class="dim"/>
  <text x="49" y="247" class="small" transform="rotate(-90 49 247)">139.7 mm depth</text>
  <text x="560" y="149" class="body">Blue: four existing width axes</text>
  <text x="560" y="177" class="body">Orange: two proposed depth axes</text>
  <text x="560" y="207" class="small">New stations: 100 and 250 mm</text>
  <text x="560" y="231" class="small">New axes centered across width</text>
