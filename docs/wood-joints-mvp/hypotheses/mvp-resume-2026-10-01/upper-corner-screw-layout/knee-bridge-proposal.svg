  <circle cx="240" cy="447.48" r="6" class="new"/>
  <circle cx="480" cy="447.48" r="6" class="new"/>
  <text x="560" y="444" class="small">38.1 mm width</text>
  <text x="560" y="468" class="small">Both spines use this local layout</text>
