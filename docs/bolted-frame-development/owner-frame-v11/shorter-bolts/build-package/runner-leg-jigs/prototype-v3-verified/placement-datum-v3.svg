<text x="108.0" y="189" font-family="Arial,sans-serif" font-size="2.7">outward normal X=+1; transform det=+1</text>
<text x="8" y="202" font-family="Arial,sans-serif" font-size="3.0">Both mark at physical U=88.269485, W=63.863974 mm; 2-mm awl aperture only.</text>
<text x="8" y="209" font-family="Arial,sans-serif" font-size="3.0">Place wood-contact face z=0 on the leg; one-sided ribs face outward from timber.</text>
<text x="8" y="216" font-family="Arial,sans-serif" font-size="3.0">Do not flip a single template between sides: use the matching L or R STL/STEP.</text>
<text x="8" y="223" font-family="Arial,sans-serif" font-size="3.0" fill="#9a3140">MARKING PROTOTYPE ONLY — NO DRILLING / FABRICATION RELEASE</text>
