<line x1="108.000" y1="165.000" x2="202.724" y2="141.670" stroke="#9a3140" stroke-width="0.8"/>
<circle cx="151.428" cy="104.977" r="1.2" fill="white" stroke="#b21f35" stroke-width="0.45"/>
