<text x="8.0" y="177" font-family="Arial,sans-serif" font-size="2.9">rail_rear_bolt_left_1</text>
<text x="8.0" y="183" font-family="Arial,sans-serif" font-size="2.7">entry X=-1308.100; Y=1556.826; Z=70.435 mm</text>
<text x="8.0" y="189" font-family="Arial,sans-serif" font-size="2.7">outward normal X=-1; transform det=+1</text>
<text x="108.0" y="24" font-family="Arial,sans-serif" font-size="4" font-weight="bold">RIGHT | det=+1</text>
