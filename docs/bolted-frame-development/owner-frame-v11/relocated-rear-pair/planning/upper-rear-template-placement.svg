<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650"><rect width="900" height="650" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#22313f;font-size:15px}.title{font-size:22px;font-weight:bold}</style><text x="20" y="30" class="title">UPPER REAR — TWO MARKS PER LEG — REVIEW PROTOTYPE</text><text x="20" y="58">Flush the oblique upper-cut edge and the rear V=0 long edge; flat skin to wood, ribs outward.</text><text x="20" y="83">Separate handed parts: LEFT has one raised edge tab; RIGHT has two. Physical use remains HOLD.</text><polygon points="94.0000,130.0000 94.0000,486.0000 372.6000,486.0000 372.6000,333.6321" fill="#e9f0f5" stroke="#344b61" stroke-width="1.3"/><line x1="94.0" y1="130" x2="372.6" y2="333.63205541930006" stroke="#b53142" stroke-width="3"/><line x1="94.0" y1="130" x2="94.0" y2="486" stroke="#236b9b" stroke-width="3"/><text x="90" y="112" font-weight="bold">LEFT — determinant +1</text><circle cx="267.12709966880004" cy="470.9830286514466" r="2" fill="white" stroke="#b53142" stroke-width="1.2"/><path d="M260.12709966880004 470.9830286514466h14M267.12709966880004 463.9830286514466v14" stroke="#b53142"/><text x="277.12709966880004" y="462.9830286514466">1</text><circle cx="200.27290041237393" cy="339.31012828044686" r="2" fill="white" stroke="#b53142" stroke-width="1.2"/><path d="M193.27290041237393 339.31012828044686h14M200.27290041237393 332.31012828044686v14" stroke="#b53142"/><text x="210.27290041237393" y="331.31012828044686">2</text><text x="70" y="518">Print bounds 178 × 141.3 × 8.2 mm</text><polygon points="778.6000,130.0000 778.6000,486.0000 500.0000,486.0000 500.0000,333.6321" fill="#e9f0f5" stroke="#344b61" stroke-width="1.3"/><line x1="778.6" y1="130" x2="500.0" y2="333.63205541930006" stroke="#b53142" stroke-width="3"/><line x1="778.6" y1="130" x2="778.6" y2="486" stroke="#236b9b" stroke-width="3"/><text x="500" y="112" font-weight="bold">RIGHT — determinant +1</text><circle cx="605.4729003312" cy="470.9830286514466" r="2" fill="white" stroke="#b53142" stroke-width="1.2"/><path d="M598.4729003312 470.9830286514466h14M605.4729003312 463.9830286514466v14" stroke="#b53142"/><text x="615.4729003312" y="462.9830286514466">1</text><circle cx="672.3270995876261" cy="339.31012828044686" r="2" fill="white" stroke="#b53142" stroke-width="1.2"/><path d="M665.3270995876261 339.31012828044686h14M672.3270995876261 332.31012828044686v14" stroke="#b53142"/><text x="682.3270995876261" y="331.31012828044686">2</text><text x="480" y="518">Print bounds 178 × 141.3 × 8.2 mm</text><text x="20" y="551">1: relocated existing bolt — down-grain U = 170.491514; W = 86.563550 mm.</text><text x="20" y="576">2: added matching bolt — down-grain U = 104.655064; W = 53.136450 mm.</text><text x="20" y="601">Ø2 apertures are for transfer marks only. Modeled Ø14.2875 bores are not drill-bit instructions.</text><text x="20" y="626" font-weight="bold">Not a drill guide, approved cut datum, physical-fit test or fabrication/climbing release.</text></svg>