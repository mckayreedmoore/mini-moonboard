<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc">
<title id="title">Proposed rectangular plywood cleat</title>
<desc id="desc">A proposed 203.2 by 361.2 millimetre plywood rectangle retains the existing four bolt locations. Each corner uses two independent 1 and 1/8 inch plywood leaves. The current mitered solid cleat outline is dashed. This is a development proposal, not a shop instruction or qualified joint.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#40546c"/></marker></defs>
<rect width="1000" height="570" rx="12" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#172b41">
<text x="32" y="35" font-size="23" font-weight="bold">Plywood cleat development</text>
<text x="32" y="60" font-size="14" fill="#9c351d">Proposed detail • complete joint and revised loads remain unqualified</text>
<g transform="translate(105 105)">
<rect width="203.2" height="361.186" fill="#e8d3aa" stroke="#624c2d" stroke-width="2"/>
<path d="M38.1 361.186 L177.8 361.186 L177.8 0 L38.1 166.488 Z" fill="none" stroke="#695d4b" stroke-width="1.8" stroke-dasharray="7 5"/>
<g fill="#f8fafc" stroke="#243d56" stroke-width="1.8">
<circle cx="82.55" cy="300.886" r="5.159"/><circle cx="133.35" cy="300.886" r="5.159"/>
<circle cx="82.55" cy="158.799" r="5.159"/><circle cx="133.35" cy="158.799" r="5.159"/>
</g>
<path d="M0 384 H203.2 M-22 0 V361.186" stroke="#40546c" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="101.6" y="406" text-anchor="middle" font-size="15">203.2 mm (8 in.)</text>
<text transform="translate(-41 180) rotate(-90)" text-anchor="middle" font-size="15">361.2 mm (14.2 in.)</text>
<path d="M35 235 H170" stroke="#376988" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="101.6" y="260" text-anchor="middle" font-size="13" fill="#295773">Panel strength axis</text>
</g>
<path d="M230 264 H350" fill="none" stroke="#40546c"/>
<text x="365" y="258" font-size="15">Four existing hole lines</text>
<text x="365" y="279" font-size="13">at both interfaces; no added bolts</text>
<path d="M245 135 L350 170" fill="none" stroke="#695d4b" stroke-dasharray="5 4"/>
<text x="365" y="167" font-size="15">Dashed: current cleat outline</text>
<text x="365" y="188" font-size="13">Rectangle gives room at the ends.</text>
<g transform="translate(700 115)">
<text x="58" y="-12" text-anchor="middle" font-size="16" font-weight="bold">Edge view</text>
<rect x="0" y="5" width="57.15" height="235" fill="#e8d3aa" stroke="#624c2d" stroke-width="2"/>
<rect x="57.15" y="5" width="57.15" height="235" fill="#eddcbd" stroke="#624c2d" stroke-width="2"/>
<g stroke="#b49b70" stroke-width="1"><path d="M11 6 V239 M22 6 V239 M34 6 V239 M45 6 V239 M68 6 V239 M80 6 V239 M91 6 V239 M103 6 V239"/></g>
<path d="M-22 78 H139 M-22 187 H139" stroke="#40546c" stroke-width="3" stroke-dasharray="8 4"/>
<path d="M0 265 H114.3" stroke="#40546c" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="57" y="288" text-anchor="middle" font-size="14">57.15 mm nominal</text>
<text x="57" y="309" text-anchor="middle" font-size="14">Two 1⅛-in. leaves</text>
<text x="57" y="335" text-anchor="middle" font-size="13">No glued-composite credit</text>
</g>
<text x="365" y="355" font-size="15" font-weight="bold">Proposed material</text>
<text x="365" y="378" font-size="14">APA 48 oc plywood, at least five plies</text>
<text x="365" y="400" font-size="14">Group 1; minimum actual leaf thickness 27 mm</text>
<text x="365" y="422" font-size="13">Stamp, thickness and condition remain unobserved.</text>
<text x="32" y="530" font-size="14">Local member clearance checked. Hardware access, services, bolt-group resistance and load sharing remain open.</text>
<text x="32" y="551" font-size="12" fill="#526274">Dimensions describe the development proposal. Use the maintained builder packet for the current geometry.</text>
</g></svg>
