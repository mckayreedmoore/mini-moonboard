[project]
name = "mini-moonboard"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cadquery>=2.8.0",
    "ocp-vscode>=3.4.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

