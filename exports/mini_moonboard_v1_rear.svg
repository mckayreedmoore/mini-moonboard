<svg xmlns="http://www.w3.org/2000/svg" width="900" height="750" viewBox="0 0 900 750" data-units="mm">
  <title>Mini MoonBoard v1 support-side elevation</title>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#333" />
    </marker>
  </defs>
  <style>
    .panel { fill: #20252b; stroke: #f0b429; stroke-width: 2; }
    .kicker { fill: #444b53; stroke: #f0b429; stroke-width: 2; }
    .seam { stroke: #aaa; stroke-width: 1.5; }
    .dim { stroke: #333; stroke-width: 1.5; marker-start: url(#arrow); marker-end: url(#arrow); }
    .rail { stroke: #8a4b16; stroke-width: 18; }
    .guide { stroke: #777; stroke-width: 1; stroke-dasharray: 5 5; }
    text { fill: #222; font: 16px sans-serif; }
    .on-dark { fill: white; }
    .warning { fill: #a3261f; font-weight: bold; }
  </style>
  <rect width="900" height="750" fill="white" />
  <text x="450" y="35" text-anchor="middle" font-size="24">Mini MoonBoard v1 support-side elevation</text>
  <text class="warning" x="450" y="65" text-anchor="middle">PROVISIONAL GEOMETRY - HUMAN STRUCTURAL AUDIT REQUIRED</text>
  <rect class="kicker" x="150.0" y="594.6" width="600.0" height="55.4" />
  <rect class="panel" x="150.0" y="135.0" width="600.0" height="459.6" />
  <line class="rail" x1="150.0" y1="135.0" x2="150.0" y2="594.6" />
  <line class="rail" x1="350.0" y1="135.0" x2="350.0" y2="594.6" />
  <line class="rail" x1="450.0" y1="135.0" x2="450.0" y2="594.6" />
  <line class="rail" x1="550.0" y1="135.0" x2="550.0" y2="594.6" />
  <line class="rail" x1="750.0" y1="135.0" x2="750.0" y2="594.6" />
  <text x="450" y="700" text-anchor="middle">Four outer/intermediate rails plus shifted center-seam rail; 36 mm board-normal service gap on support side.</text>
  <text x="450" y="725" text-anchor="middle">Bearing blocks and rear ties are separate, non-overlapping CAD solids; tie splices require human review.</text>
</svg>
