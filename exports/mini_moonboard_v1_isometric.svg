  <polygon class="panel" points="230.8,513.5 669.2,647.5 857.1,127.3 418.7,-6.6" />
  <line class="seam" x1="450.0" y1="580.5" x2="637.9" y2="60.4" />
  <line class="seam" x1="324.7" y1="253.4" x2="763.2" y2="387.4" />
  <line class="rail" x1="224.1" y1="507.2" x2="412.0" y2="-13.0" />
  <line class="rail" x1="378.6" y1="554.4" x2="566.5" y2="34.2" />
  <line class="rail" x1="428.1" y1="569.5" x2="616.0" y2="49.4" />
  <line class="rail" x1="502.8" y1="592.3" x2="690.7" y2="72.2" />
  <line class="rail" x1="662.6" y1="641.2" x2="850.5" y2="121.0" />
  <line class="leg" x1="378.1" y1="459.8" x2="316.7" y2="186.5" />
