<svg xmlns="http://www.w3.org/2000/svg" width="900" height="750" viewBox="0 0 900 750" data-units="mm">
  <title>Mini MoonBoard v1 provisional isometric render</title>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#333" />
    </marker>
  </defs>
  <style>
    .panel { fill: #20252b; stroke: #f0b429; stroke-width: 2; }
    .kicker { fill: #444b53; stroke: #f0b429; stroke-width: 2; }
    .seam { stroke: #aaa; stroke-width: 1.5; }
    .dim { stroke: #333; stroke-width: 1.5; marker-start: url(#arrow); marker-end: url(#arrow); }
    .leg { stroke: #8a4b16; stroke-width: 16; stroke-linecap: round; }
    .rail { stroke: #6f3510; stroke-width: 9; }
    .guide { stroke: #777; stroke-width: 1; stroke-dasharray: 5 5; }
    text { fill: #222; font: 16px sans-serif; }
    .on-dark { fill: white; }
    .warning { fill: #a3261f; font-weight: bold; }
  </style>
  <rect width="900" height="750" fill="white" />
  <text x="450" y="35" text-anchor="middle" font-size="24">Mini MoonBoard v1 provisional isometric render</text>
  <text class="warning" x="450" y="65" text-anchor="middle">PROVISIONAL GEOMETRY - HUMAN STRUCTURAL AUDIT REQUIRED</text>
  <polygon class="kicker" points="230.4,562.9 669.6,697.1 669.6,647.6 230.4,513.4" />
  <polygon class="panel" points="230.4,513.4 669.6,647.6 857.8,126.6 418.6,-7.6" />
  <line class="seam" x1="450.0" y1="580.5" x2="638.2" y2="59.5" />
  <line class="seam" x1="324.5" y1="252.9" x2="763.7" y2="387.1" />
  <line class="rail" x1="236.9" y1="509.6" x2="425.1" y2="-11.4" />
  <line class="rail" x1="383.3" y1="554.4" x2="571.5" y2="33.4" />
  <line class="rail" x1="529.7" y1="599.1" x2="717.9" y2="78.1" />
  <line class="rail" x1="676.1" y1="643.8" x2="864.3" y2="122.8" />
  <line class="leg" x1="400.7" y1="460.7" x2="341.3" y2="196.4" />
  <line class="leg" x1="341.3" y1="196.4" x2="372.2" y2="111.0" />
  <line class="leg" x1="846.3" y1="596.9" x2="787.0" y2="332.6" />
  <line class="leg" x1="787.0" y1="332.6" x2="817.9" y2="247.2" />
  <text x="450" y="710" text-anchor="middle">Isometric review render: panels, kicker, four face rails, and two exterior hockey-stick legs.</text>
