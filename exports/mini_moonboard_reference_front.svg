<svg xmlns="http://www.w3.org/2000/svg" width="900" height="750" viewBox="0 0 900 750" data-units="mm">
  <title>Mini MoonBoard reference front envelope</title>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#333" />
    </marker>
  </defs>
  <style>
    .panel { fill: #20252b; stroke: #f0b429; stroke-width: 2; }
    .kicker { fill: #444b53; stroke: #f0b429; stroke-width: 2; }
    .seam { stroke: #aaa; stroke-width: 1.5; }
    .dim { stroke: #333; stroke-width: 1.5; marker-start: url(#arrow); marker-end: url(#arrow); }
    .guide { stroke: #777; stroke-width: 1; stroke-dasharray: 5 5; }
    text { fill: #222; font: 16px sans-serif; }
    .on-dark { fill: white; }
    .warning { fill: #a3261f; font-weight: bold; }
  </style>
  <rect width="900" height="750" fill="white" />
  <text x="450" y="35" text-anchor="middle" font-size="24">Mini MoonBoard reference front envelope</text>
  <text class="warning" x="450" y="65" text-anchor="middle">REFERENCE ONLY - NOT A FRAME DESIGN</text>
  <rect class="kicker" x="150.0" y="613.1" width="600.0" height="36.9" />
  <rect class="panel" x="150.0" y="153.5" width="600.0" height="459.6" />
  <line class="seam" x1="450.0" y1="153.5" x2="450.0" y2="650.0" />
  <line class="seam" x1="150.0" y1="383.3" x2="750.0" y2="383.3" />
  <line class="dim" x1="150.0" y1="700" x2="750.0" y2="700" />
  <text x="450.0" y="725" text-anchor="middle">2440.0 mm / 96 1/16 in</text>
  <line class="dim" x1="100" y1="153.5" x2="100" y2="650.0" />
  <text x="85" y="401.7" text-anchor="middle" transform="rotate(-90 85 401.7)">2019.1 mm / 79 1/2 in overall</text>
  <text class="on-dark" x="450.0" y="642.0" text-anchor="middle">kicker 150 mm / 5 7/8 in</text>
</svg>
