<svg xmlns="http://www.w3.org/2000/svg" width="900" height="750" viewBox="0 0 900 750" data-units="mm">
  <title>Mini MoonBoard v1 provisional side concept</title>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#333" />
    </marker>
  </defs>
  <style>
    .panel { fill: #20252b; stroke: #f0b429; stroke-width: 2; }
    .kicker { fill: #444b53; stroke: #f0b429; stroke-width: 2; }
    .seam { stroke: #aaa; stroke-width: 1.5; }
    .dim { stroke: #333; stroke-width: 1.5; marker-start: url(#arrow); marker-end: url(#arrow); }
    .leg { stroke: #8a4b16; stroke-width: 16; stroke-linecap: round; }
    .datum { fill: #a3261f; }
    .guide { stroke: #777; stroke-width: 1; stroke-dasharray: 5 5; }
    text { fill: #222; font: 16px sans-serif; }
    .on-dark { fill: white; }
    .warning { fill: #a3261f; font-weight: bold; }
  </style>
  <rect width="900" height="750" fill="white" />
  <text x="450" y="35" text-anchor="middle" font-size="24">Mini MoonBoard v1 provisional side concept</text>
  <text class="warning" x="450" y="65" text-anchor="middle">PROVISIONAL GEOMETRY - HUMAN STRUCTURAL AUDIT REQUIRED</text>
  <line class="guide" x1="90" y1="650.0" x2="820" y2="650.0" />
  <rect class="kicker" x="150.0" y="594.1" width="10" height="55.9" />
  <line class="panel" x1="155.0" y1="594.1" x2="544.4" y2="130.0" stroke-width="8" />
  <line class="leg" x1="514.2" y1="650.0" x2="391.4" y2="312.4" />
  <line class="leg" x1="391.4" y1="312.4" x2="455.2" y2="236.3" />
  <circle class="datum" cx="391.4" cy="312.4" r="5" />
  <text x="403.4" y="300.4">row 8 bend datum</text>
  <text x="465.2" y="228.3">row 10 upper datum</text>
  <text x="522.2" y="638.0">provisional rear foot</text>
  <text x="143.0" y="622.0" text-anchor="end">225 mm kicker</text>
  <text x="450" y="700" text-anchor="middle">Two exterior laminated legs are coincident in this side view; 60 degree lower-leg angle.</text>
</svg>
