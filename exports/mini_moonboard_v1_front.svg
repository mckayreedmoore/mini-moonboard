<svg xmlns="http://www.w3.org/2000/svg" width="900" height="750" viewBox="0 0 900 750" data-units="mm">
  <title>Mini MoonBoard v1 climbing-face elevation (underside)</title>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#333" />
    </marker>
  </defs>
  <style>
    .panel { fill: #20252b; stroke: #f0b429; stroke-width: 2; }
    .kicker { fill: #444b53; stroke: #f0b429; stroke-width: 2; }
    .seam { stroke: #aaa; stroke-width: 1.5; }
    .dim { stroke: #333; stroke-width: 1.5; marker-start: url(#arrow); marker-end: url(#arrow); }
    .guide { stroke: #777; stroke-width: 1; stroke-dasharray: 5 5; }
    text { fill: #222; font: 16px sans-serif; }
    .on-dark { fill: white; }
    .warning { fill: #a3261f; font-weight: bold; }
  </style>
  <rect width="900" height="750" fill="white" />
  <text x="450" y="35" text-anchor="middle" font-size="24">Mini MoonBoard v1 climbing-face elevation (underside)</text>
  <text class="warning" x="450" y="65" text-anchor="middle">V1 PROVISIONAL - AUDIT BEFORE FABRICATION</text>
  <rect class="kicker" x="150.0" y="594.6" width="600.0" height="55.4" />
  <rect class="panel" x="150.0" y="135.0" width="600.0" height="459.6" />
  <line class="seam" x1="450.0" y1="135.0" x2="450.0" y2="650.0" />
  <line class="seam" x1="150.0" y1="364.8" x2="750.0" y2="364.8" />
  <line class="dim" x1="150.0" y1="700" x2="750.0" y2="700" />
  <text x="450.0" y="725" text-anchor="middle">2438 mm / 96 in</text>
  <line class="dim" x1="100" y1="135.0" x2="100" y2="650.0" />
  <text x="85" y="392.5" text-anchor="middle" transform="rotate(-90 85 392.5)">2092.9 mm / 82 3/8 in overall</text>
  <text class="on-dark" x="450.0" y="642.0" text-anchor="middle">kicker 225 mm / 8 7/8 in</text>
  <line class="seam" x1="150.0" y1="631.5" x2="750.0" y2="631.5" />
  <text class="on-dark" x="450.0" y="614.6" text-anchor="middle">official 150 mm / 5 7/8 in active zone</text>
</svg>
