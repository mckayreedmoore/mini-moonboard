<text x="770.000" y="545.000" class="">Matched wood stack 76.20; guide/flange/cap 28.575; breakout 6.35.</text>
<text x="770.000" y="573.000" class="">Required free projection: 113.125 nominal / 113.825 worst.</text>
<text x="770.000" y="601.000" class="">Includes 2.00 chuck-to-cap gap. Overall bit length alone cannot prove fit.</text>
<text x="770.000" y="640.000" class="title">Guide inserts / cap</text>
<text x="770.000" y="670.000" class="">Proposed insert body Ø15.875; effective guidance ≥19.05.</text>
<text x="770.000" y="698.000" class="">Flange Ø22.225×3.175; cap 6.35; cap holes Ø12.70.</text>
<text x="770.000" y="726.000" class="">Insert IDs match chosen bit; diametral play ≤0.10.</text>
<text x="770.000" y="754.000" class="">Cap fasteners at u 12.70 / 69.85 / 127.00, v 180; flush.</text>
<text x="770.000" y="782.000" class="">Fasteners stay in guide; retention/stiffness unqualified.</text>
<text x="770.000" y="810.000" class="">Red circles: local chuck nose radius 31.75, one axis at a time.</text>
<text x="770.000" y="850.000" class="title">Registration / full-path budget</text>
<text x="770.000" y="880.000" class="">Common rear fence: u 0. Post bottom: v 0. Cleat bottom: v 139.70.</text>
<text x="770.000" y="908.000" class="">Hole u 44.45 / 95.25; v 180. Post top v 238.90.</text>
<text x="770.000" y="936.000" class="">Both holes share one setup; separate post and cleat clamps remain.</text>
<text x="770.000" y="964.000" class="">Relative bore/screw bound 1.50; allocated 1.46; body gap left 2.44375.</text>
<text x="770.000" y="992.000" class="">Guide normal ≤0.08° over full 111.825-mm path; drift budget applies.</text>
<text x="770.000" y="1020.000" class="">Actuals remain blank. No joint, Cdelta, hardware or machining pass.</text>
<text x="770.000" y="1060.000" class="title">Handed mapping</text>
<text x="770.000" y="1090.000" class="">Y = u −175.70; Z = v. Drill is inward through cleat then post.</text>
<text x="770.000" y="1118.000" class="">Left: X = −1168.40 − w. Right: X = 1165.225 + w.</text>
<text x="770.000" y="1146.000" class="">No frame member, permanent fastener, current viewer or field changed.</text>
<text x="770.000" y="1174.000" class="">Detailed intervals, clamp requirements and missing inputs: sibling JSON.</text>
<text x="770.000" y="1202.000" class="hold">Paper scaling does not establish precision. This drawing authorizes no cut.</text>
