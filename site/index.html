        const hit = event.altKey && model === 'owner-barrel-layout' ?
          hits.find(result => result.object.userData.part?.fabrication?.owner_barrel_overlay) || hits[0] : hits[0];
        if (!hit) return;
        selected.forEach(mesh => mesh.material.emissive.setHex(mesh.userData.baseEmissive || 0));
        if (hit.object.userData.crashPad) {
          selected = [hit.object]; hit.object.material.emissive.setHex(0x243344);
          const pad = hit.object.userData.crashPad;
          partCard.textContent = `Crash pad ${pad.index}: 48 × 72 × 5 in (${pad.dimensions_mm.map(v => v.toFixed(1)).join(' × ')} mm). Nominal owner-reported stack: ${pad.layup}. Two pads arranged side by side with the center seam running front to back, resting on the floor. Loose padding preview; excluded from frame weight, CAD dimensions and structural/floor-contact checks.`;
          return;
        }
        if (hit.object.userData.hold) {
          selected = [hit.object]; hit.object.material.emissive.setHex(0x493322);
          const hold = hit.object.userData.hold;
          if (problemEdit.checked && !problemControls.disabled) {
            markProblem(hold.position);
          }
          partCard.textContent = `${hold.position}: ${holdFamilies[hold.family]} · approximate ${hold.shape}; visual size ${hold.width} × ${hold.height} × ${hold.depth} mm; estimated rotation ${hold.rotation}°. Grid location identifies this preview, not a manufacturer hold number. Visual only; excluded from frame weight and engineering checks. Use the official setup for installation.`;
          return;
        }
        const part = hit.object.userData.part;
        selected = part === personPart ? personMeshes : [hit.object];
        selected.forEach(mesh => mesh.material.emissive.setHex(mesh.userData.baseEmissive || 0x5f3600));
        if (part.fabrication.owner_corner_overlay || part.fabrication.owner_barrel_overlay) {
          partCard.textContent = `${part.name}: ${part.fabrication.description}. Diagnostic owner-review geometry only; no drilling, fabrication, or structural release.`;
          return;
        }
        const [x, y, z] = part.fabrication.dimensions_mm;
        partCard.textContent = `${part.name}: ${part.fabrication.description}; ${part.fabrication.clearance_status || 'clearance not screened'}; nominal dimensions ${[x, y, z].map(v => Number(v.toFixed(3))).join(' × ')} mm (${[x, y, z].map(feetAndInches).join(' × ')}).${model === 'bolted-v4-development' && !part.fabrication.v4_overlay ? ' Selected baseline context only; not V4 fabrication geometry.' : ''}`;
      });
      function resize() { const { innerWidth:w, innerHeight:h } = window; renderer.setSize(w,h); camera.aspect=w/h; camera.zoom=Math.min(1,w/h); camera.updateProjectionMatrix(); }
      addEventListener('resize', resize); resize();
      (function frame() { controls.update(); renderer.render(scene, camera); requestAnimationFrame(frame); })();
    </script>
  </body>
</html>
