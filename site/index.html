<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Independent DIY frame for the Mini MoonBoard — Interactive CAD View</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23121619'/%3E%3Cpath d='M12 50 27 12h25L37 50Z' fill='%23a65a16'/%3E%3C/svg%3E" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #121619; color: #f5f0e6; font: 16px system-ui, sans-serif; }
      header { position: fixed; z-index: 1; inset: 0 auto auto 0; padding: 1rem 1.25rem; background: #121619dd; }
      h1 { font-size: 1.1rem; margin: 0 0 .25rem; }
      p { color: #c7c1b4; font-size: .9rem; margin: 0; }
      .support-link { display: inline-block; margin-top: .55rem; color: #f0b429; font-size: .85rem; text-underline-offset: .2em; }
      #part { margin-top: .5rem; color: #f5f0e6; font-size: .85rem; max-width: 28rem; }
      label { display: block; margin-top: .55rem; color: #c7c1b4; font-size: .8rem; }
      select { margin-left: .35rem; background: #222a2f; border: 1px solid #59636b; border-radius: .2rem; color: #f5f0e6; padding: .2rem; }
      canvas { display: block; height: 100vh; width: 100vw; }
    </style>
  </head>
  <body>
    <header><h1>Independent DIY frame plans for the Mini MoonBoard</h1><p>Not affiliated with or endorsed by Moon Climbing.</p><p>V1 CAD assembly · underside climbing face · drag to orbit · scroll to zoom · click wood or colored connection geometry to inspect it</p><label>Panel overlay <select id="overlay"><option value="none">None</option><option value="grid">Grid-reference labels</option><option value="grid-high">High-contrast grid-reference labels</option></select></label><label><input id="dimensions" type="checkbox" checked /> Overall V1 dimensions</label><label><input id="person" type="checkbox" checked /> 5 ft 8 in reference person</label><div id="part">Loading selectable CAD parts…</div><a class="support-link" href="https://ko-fi.com/mckayreedmoore" target="_blank" rel="noopener noreferrer">Support this project on Ko-fi ↗</a></header>
    <script type="importmap">
      { "imports": { "three": "https://unpkg.com/three@0.161.0/build/three.module.js" } }
    </script>
    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'https://unpkg.com/three@0.161.0/examples/jsm/controls/OrbitControls.js';
      import { STLLoader } from 'https://unpkg.com/three@0.161.0/examples/jsm/loaders/STLLoader.js';

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#121619');
      const camera = new THREE.PerspectiveCamera(42, 1, 1, 10000);
      camera.up.set(0, 0, 1);
      // Initial camera: hold-facing front (the underside climbing face), not
      // the braced support side.
      // Start as an overview: center the board plus front-left scale figure,
      // and leave useful front-to-back space instead of loading close to it.
      camera.position.set(4300, 4700, 1600);
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(300, 700, 1050);
      controls.enableDamping = true;
      controls.minDistance = 700;
      controls.maxDistance = 7000;
      scene.add(new THREE.HemisphereLight(0xffffff, 0x222222, 2.4));
      const key = new THREE.DirectionalLight(0xffffff, 2.5); key.position.set(2000, 2500, 500); scene.add(key);
      const grid = new THREE.GridHelper(5000, 25, 0x6a6256, 0x34302a); grid.rotateX(Math.PI / 2); scene.add(grid);
      const loader = new STLLoader(), meshes = [], raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();
      // Mirror CAD X for the climber-facing convention: visible left is the A
      // side (where McKay stands); visible right is the K side.
      // Presentation offset only: keep McKay at the established front-left
      // reference point while placing the complete board assembly farther rearward.
      const assemblyView = new THREE.Group(); assemblyView.position.set(0, -950, 0); scene.add(assemblyView);
      const climberView = new THREE.Group(); climberView.scale.x = -1; assemblyView.add(climberView);
      const partCard = document.querySelector('#part'); let selected = [];
      const colorFor = part => part.fabrication.clearance_status?.startsWith('FAIL') ? 0xef5350 : part.name.startsWith('analysis_') ? 0x29b6d6 : part.name.startsWith('main_') ? 0x20252b : part.name.startsWith('kicker_') ? 0x444b53 : 0x9d5a24;
      fetch('parts.json').then(response => response.json()).then(({ parts, bounds_mm }) => {
        drawDimensions(bounds_mm);
        partCard.textContent = 'Click wood for cut dimensions or colored connection geometry for its clearance-screen status.';
        parts.forEach(part => loader.load(part.path, geometry => {
          geometry.computeVertexNormals();
          const mesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color: colorFor(part), roughness: .7, metalness: .05 }));
          mesh.userData.part = part; meshes.push(mesh); climberView.add(mesh);
        }));
      }).catch(error => { partCard.textContent = `Could not load CAD parts: ${error.message}`; });
      const overlay = new THREE.Group(); assemblyView.add(overlay);
      // Decal planes lie 0.5 mm in front of the actual underside face. Their
      // orientation and positions use the same 40° datum as the drilled-hole model.
      const labelDecal = (text, color, position) => {
        const canvas = document.createElement('canvas'); canvas.width = canvas.height = 128;
        const context = canvas.getContext('2d'); context.fillStyle = color;
        context.font = 'bold 72px system-ui'; context.textAlign = 'center'; context.textBaseline = 'middle';
        // The outward-facing plane is rotated 230° about X, so turn the canvas
        // 180° to keep the printed glyph upright from the climber's viewpoint.
        context.translate(64, 64); context.rotate(Math.PI); context.fillText(text, 0, 2);
        const texture = new THREE.CanvasTexture(canvas);
        const decal = new THREE.Mesh(
          new THREE.PlaneGeometry(95, 95),
          new THREE.MeshBasicMaterial({ map: texture, transparent: true, depthWrite: false, side: THREE.FrontSide }),
        );
        decal.position.fromArray(position); decal.rotation.x = 230 * Math.PI / 180; overlay.add(decal);
      };
      const mainFacePoint = (x, distance) => [x, -18 + .5 * Math.cos(Math.PI / 180 * 40) + distance * Math.sin(Math.PI / 180 * 40), 225 - .5 * Math.sin(Math.PI / 180 * 40) + distance * Math.cos(Math.PI / 180 * 40)];
      const makeGridOverlay = color => {
        overlay.clear();
        // In climber-facing coordinates, +X is left and -X is right. A starts
        // at climber-left; the row numbers therefore also belong at +X.
        'ABCDEFGHIJK'.split('').forEach((letter, index) => labelDecal(letter, color, mainFacePoint(1019.2 - index * 200, 2380)));
        // Keep the row decals inside the climber-left edge, but outside the
        // 200 mm T-nut column: 1160 mm is 59.2 mm inboard of the panel edge.
        Array.from({ length: 12 }, (_, index) => labelDecal(String(index + 1), color, mainFacePoint(1160, 80 + index * 200)));
      };
      const overlaySelect = document.querySelector('#overlay');
      overlaySelect.addEventListener('change', () => {
        if (overlaySelect.value === 'none') overlay.clear();
        else makeGridOverlay(overlaySelect.value === 'grid' ? '#f0b429' : '#f5f0e6');
      });
      const dimensions = new THREE.Group(); assemblyView.add(dimensions);
      const dimensionLabel = (text, point) => {
        const canvas = document.createElement('canvas'); canvas.width = 1024; canvas.height = 128;
        const context = canvas.getContext('2d'); context.fillStyle = '#121619dd'; context.fillRect(0, 0, 1024, 128);
        context.fillStyle = '#f5f0e6'; context.font = 'bold 64px system-ui';
        const fontSize = Math.min(64, 64 * 980 / context.measureText(text).width);
        context.font = `bold ${fontSize}px system-ui`; context.textAlign = 'center'; context.textBaseline = 'middle'; context.fillText(text, 512, 68);
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true, depthWrite: false }));
        sprite.position.fromArray(point); sprite.scale.set(760, 95, 1); dimensions.add(sprite);
      };
      const dimensionLine = (start, end, tick, label) => {
        const material = new THREE.LineBasicMaterial({ color: 0xf0b429 });
        const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...start), new THREE.Vector3(...end)]), material); dimensions.add(line);
        [start, end].forEach(point => dimensions.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...point).add(new THREE.Vector3(...tick)), new THREE.Vector3(...point).sub(new THREE.Vector3(...tick))]), material)));
        dimensionLabel(label, start.map((value, index) => (value + end[index]) / 2 + (index === 2 ? 85 : 0)));
      };
      // Keep dimensions synchronized with CAD, including the outside legs.
      function drawDimensions([[xmin, ymin, zmin], [xmax, ymax, zmax]]) {
        const label = (name, mm) => `${name} ${mm.toFixed(1)} mm / ${(mm / 25.4).toFixed(2)} in`;
        dimensionLine([-xmax, ymax + 140, 20], [-xmin, ymax + 140, 20], [0, 0, 55], label('WIDTH', xmax - xmin));
        dimensionLine([-xmax - 120, ymin, 20], [-xmax - 120, ymax, 20], [0, 0, 55], label('DEPTH', ymax - ymin));
        dimensionLine([-xmax - 120, ymax + 100, zmin], [-xmax - 120, ymax + 100, zmax], [55, 0, 0], label('HEIGHT', zmax - zmin));
      }
      document.querySelector('#dimensions').addEventListener('change', event => { dimensions.visible = event.target.checked; });
      // +X is climber-left after the display-only face reflection. At floor
      // level Y=250 is in front of the lower climbing face; the bracing is on
      // the opposite, support-side normal. Do not infer front/back from a
      // global Y sign because the board is sloped.
      const person = new THREE.Group(), personMeshes = []; person.position.set(1710, 250, 0); scene.add(person);
      const personPart = { name: 'McKay', fabrication: { dimensions_mm: [450, 300, 1727.2], dimensions_imperial: [17.72, 11.81, 68.00], description: 'an absolutely staggering 5\'8\" reference person; display-only and excluded from CAD, cut lists, stability, and FEA' } };
      const addPersonPart = (geometry, position, rotation = [0, 0, 0]) => {
        const mesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color: 0x607d8b, roughness: .85 }));
        mesh.position.fromArray(position); mesh.rotation.fromArray(rotation); mesh.userData.part = personPart; meshes.push(mesh); personMeshes.push(mesh); person.add(mesh);
      };
      // Simplified 1727.2 mm / 5 ft 8 in mannequin: visual scale reference only.
      addPersonPart(new THREE.CylinderGeometry(82, 105, 720, 12), [0, 0, 1125], [Math.PI / 2, 0, 0]);
      addPersonPart(new THREE.SphereGeometry(90, 16, 12), [0, 0, 1637.2]);
      [-95, 95].forEach(x => addPersonPart(new THREE.CylinderGeometry(48, 55, 740, 10), [x, 0, 370], [Math.PI / 2, 0, 0]));
      [-150, 150].forEach(x => addPersonPart(new THREE.CylinderGeometry(36, 42, 590, 10), [x, 0, 1110], [Math.PI / 2, 0, 0]));
      const personMaterial = new THREE.LineBasicMaterial({ color: 0x87ceeb });
      person.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-250, 0, 0), new THREE.Vector3(-250, 0, 1727.2)]), personMaterial));
      [[-305, 0, 0], [-195, 0, 0], [-305, 0, 1727.2], [-195, 0, 1727.2]].forEach((point, index, points) => { if (index % 2 === 0) person.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...point), new THREE.Vector3(...points[index + 1])]), personMaterial)); });
      const personCanvas = document.createElement('canvas'); personCanvas.width = 1024; personCanvas.height = 128;
      const personContext = personCanvas.getContext('2d'); personContext.fillStyle = '#121619dd'; personContext.fillRect(0, 0, 1024, 128); personContext.fillStyle = '#f5f0e6'; personContext.font = 'bold 58px system-ui'; personContext.textAlign = 'center'; personContext.textBaseline = 'middle'; personContext.fillText("MCKAY — 5'8\" / 1727.2 mm", 512, 68);
      const personLabel = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(personCanvas), transparent: true, depthWrite: false })); personLabel.position.set(-250, 0, 1815); personLabel.scale.set(700, 88, 1); person.add(personLabel);
      document.querySelector('#person').addEventListener('change', event => { person.visible = event.target.checked; });
      renderer.domElement.addEventListener('pointerdown', event => {
        pointer.x = event.clientX / innerWidth * 2 - 1; pointer.y = -(event.clientY / innerHeight) * 2 + 1;
        raycaster.setFromCamera(pointer, camera); const hit = raycaster.intersectObjects(meshes)[0];
        if (!hit) return;
        selected.forEach(mesh => mesh.material.emissive.setHex(0));
        const part = hit.object.userData.part;
        selected = part === personPart ? personMeshes : [hit.object];
        selected.forEach(mesh => mesh.material.emissive.setHex(0x5f3600));
        const [x, y, z] = part.fabrication.dimensions_mm, [ix, iy, iz] = part.fabrication.dimensions_imperial;
        partCard.textContent = `${part.name}: ${part.fabrication.description}; ${part.fabrication.clearance_status || 'clearance not screened'}; nominal dimensions ${x} × ${y} × ${z} mm (${ix} × ${iy} × ${iz}).`;
      });
      function resize() { const { innerWidth:w, innerHeight:h } = window; renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix(); }
      addEventListener('resize', resize); resize();
      (function frame() { controls.update(); renderer.render(scene, camera); requestAnimationFrame(frame); })();
    </script>
  </body>
</html>
