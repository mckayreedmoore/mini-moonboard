<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mini MoonBoard V1 — Interactive CAD View</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23121619'/%3E%3Cpath d='M12 50 27 12h25L37 50Z' fill='%23a65a16'/%3E%3C/svg%3E" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #121619; color: #f5f0e6; font: 16px system-ui, sans-serif; }
      header { position: fixed; z-index: 1; inset: 0 auto auto 0; padding: 1rem 1.25rem; background: #121619dd; }
      h1 { font-size: 1.1rem; margin: 0 0 .25rem; }
      p { color: #c7c1b4; font-size: .9rem; margin: 0; }
      #part { margin-top: .5rem; color: #f5f0e6; font-size: .85rem; max-width: 28rem; }
      label { display: block; margin-top: .55rem; color: #c7c1b4; font-size: .8rem; }
      select { margin-left: .35rem; background: #222a2f; border: 1px solid #59636b; border-radius: .2rem; color: #f5f0e6; padding: .2rem; }
      canvas { display: block; height: 100vh; width: 100vw; }
    </style>
  </head>
  <body>
    <header><h1>Mini MoonBoard V1 — CAD assembly</h1><p>Initial view: underside climbing face · drag to orbit · scroll to zoom · click wood or cyan connection geometry to inspect it</p><label>Panel overlay <select id="overlay"><option value="none">None</option><option value="grid">Grid labels</option><option value="grid-high">High-contrast grid labels</option></select></label><div id="part">Loading selectable CAD parts…</div></header>
    <script type="importmap">
      { "imports": { "three": "https://unpkg.com/three@0.161.0/build/three.module.js" } }
    </script>
    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'https://unpkg.com/three@0.161.0/examples/jsm/controls/OrbitControls.js';
      import { STLLoader } from 'https://unpkg.com/three@0.161.0/examples/jsm/loaders/STLLoader.js';

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#121619');
      const camera = new THREE.PerspectiveCamera(42, 1, 1, 10000);
      camera.up.set(0, 0, 1);
      // Positive Y and low Z look at the actual underside climbing face.
      camera.position.set(3100, 3200, 750);
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 750, 1050);
      controls.enableDamping = true;
      controls.minDistance = 700;
      controls.maxDistance = 7000;
      scene.add(new THREE.HemisphereLight(0xffffff, 0x222222, 2.4));
      const key = new THREE.DirectionalLight(0xffffff, 2.5); key.position.set(2000, 2500, 500); scene.add(key);
      const grid = new THREE.GridHelper(5000, 25, 0x6a6256, 0x34302a); grid.rotateX(Math.PI / 2); scene.add(grid);
      const loader = new STLLoader(), meshes = [], raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();
      // CAD +X is the template's left-to-right construction coordinate. Mirror
      // it for the climber-facing view, where the visible left edge is A/rows.
      const climberView = new THREE.Group(); climberView.scale.x = -1; scene.add(climberView);
      const partCard = document.querySelector('#part'); let selected;
      const colorFor = name => name.startsWith('analysis_') ? 0x29b6d6 : name.startsWith('main_') ? 0x20252b : name.startsWith('kicker_') ? 0x444b53 : 0x9d5a24;
      fetch('parts.json').then(response => response.json()).then(({ parts }) => {
        partCard.textContent = 'Click wood for cut dimensions or cyan geometry for a primary FEA connection representation.';
        parts.forEach(part => loader.load(part.path, geometry => {
          geometry.computeVertexNormals();
          const mesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color: colorFor(part.name), roughness: .7, metalness: .05 }));
          mesh.userData.part = part; meshes.push(mesh); climberView.add(mesh);
        }));
      }).catch(error => { partCard.textContent = `Could not load CAD parts: ${error.message}`; });
      const overlay = new THREE.Group(); scene.add(overlay);
      // Decal planes lie 0.5 mm in front of the actual underside face. Their
      // orientation and positions use the same 40° datum as the drilled-hole model.
      const labelDecal = (text, color, position) => {
        const canvas = document.createElement('canvas'); canvas.width = canvas.height = 128;
        const context = canvas.getContext('2d'); context.fillStyle = color;
        context.font = 'bold 72px system-ui'; context.textAlign = 'center'; context.textBaseline = 'middle';
        // The outward-facing plane is rotated 230° about X, so turn the canvas
        // 180° to keep the printed glyph upright from the climber's viewpoint.
        context.translate(64, 64); context.rotate(Math.PI); context.fillText(text, 0, 2);
        const texture = new THREE.CanvasTexture(canvas);
        const decal = new THREE.Mesh(
          new THREE.PlaneGeometry(95, 95),
          new THREE.MeshBasicMaterial({ map: texture, transparent: true, depthWrite: false, side: THREE.FrontSide }),
        );
        decal.position.fromArray(position); decal.rotation.x = 230 * Math.PI / 180; overlay.add(decal);
      };
      const mainFacePoint = (x, distance) => [x, -18 + .5 * Math.cos(Math.PI / 180 * 40) + distance * Math.sin(Math.PI / 180 * 40), 225 - .5 * Math.sin(Math.PI / 180 * 40) + distance * Math.cos(Math.PI / 180 * 40)];
      const makeGridOverlay = color => {
        overlay.clear();
        // In climber-facing coordinates, +X is left and -X is right. A starts
        // at climber-left; the row numbers therefore also belong at +X.
        'ABCDEFGHIJK'.split('').forEach((letter, index) => labelDecal(letter, color, mainFacePoint(1019.2 - index * 200, 2380)));
        Array.from({ length: 12 }, (_, index) => labelDecal(String(index + 1), color, mainFacePoint(1019.2, 80 + index * 200)));
      };
      const overlaySelect = document.querySelector('#overlay');
      overlaySelect.addEventListener('change', () => {
        if (overlaySelect.value === 'none') overlay.clear();
        else makeGridOverlay(overlaySelect.value === 'grid' ? '#f0b429' : '#f5f0e6');
      });
      renderer.domElement.addEventListener('pointerdown', event => {
        pointer.x = event.clientX / innerWidth * 2 - 1; pointer.y = -(event.clientY / innerHeight) * 2 + 1;
        raycaster.setFromCamera(pointer, camera); const hit = raycaster.intersectObjects(meshes)[0];
        if (!hit) return;
        if (selected) selected.material.emissive.setHex(0);
        selected = hit.object; selected.material.emissive.setHex(0x5f3600);
        const part = selected.userData.part, [x, y, z] = part.fabrication.dimensions_mm, [ix, iy, iz] = part.fabrication.dimensions_imperial;
        partCard.textContent = `${part.name}: ${part.fabrication.description}; nominal dimensions ${x} × ${y} × ${z} mm (${ix} × ${iy} × ${iz}).`;
      });
      function resize() { const { innerWidth:w, innerHeight:h } = window; renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix(); }
      addEventListener('resize', resize); resize();
      (function frame() { controls.update(); renderer.render(scene, camera); requestAnimationFrame(frame); })();
    </script>
  </body>
</html>
