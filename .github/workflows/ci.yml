name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      include_historical:
        description: Also test preserved historical models and V1 exports
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Fetch pinned source revision for inventory checks
        run: git fetch --no-tags --depth=1 origin df7f5eca86ae831b35a8bcf9e6dcd7ae8af852bb
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: |
          uv python install
          uv sync --locked
      - name: Lint maintained entry points
        id: lint
        continue-on-error: true
        run: >-
          uv run ruff check --no-cache mini_moonboard fea scripts tests
          --extend-exclude fea/contact_wrench_benchmark.py
      - name: Test
        id: tests
        continue-on-error: true
        run: uv run pytest ${{ inputs.include_historical && '--include-historical' || '' }}
      - name: Smoke-test CadQuery
        id: cad_smoke
        continue-on-error: true
        run: uv run scripts/smoke_test.py
      - name: Rebuild and verify the current candidate
        id: selected_candidate
        continue-on-error: true
        run: uv run python -m scripts.current_candidate --check-exports
      - name: Rebuild and round-trip the owner-reviewed wood-joint candidate
        id: wood_joint_candidate
        continue-on-error: true
        run: uv run python -m scripts.wood_joint_development_candidate_check
      - name: Verify historical reference/V1 exports
        if: ${{ inputs.include_historical }}
        run: |
          uv run python -m mini_moonboard.export
          git diff --exit-code -- exports
      - name: Fail if any validation gate failed
        if: always()
        run: |
          failed=0
          if [[ "${{ steps.lint.outcome }}" != "success" ]]; then
            echo "Lint gate: ${{ steps.lint.outcome }}"
            failed=1
          fi
          if [[ "${{ steps.tests.outcome }}" != "success" ]]; then
            echo "Test gate: ${{ steps.tests.outcome }}"
            failed=1
          fi
          if [[ "${{ steps.cad_smoke.outcome }}" != "success" ]]; then
            echo "CadQuery smoke gate: ${{ steps.cad_smoke.outcome }}"
            failed=1
          fi
          if [[ "${{ steps.selected_candidate.outcome }}" != "success" ]]; then
            echo "Selected-candidate gate: ${{ steps.selected_candidate.outcome }}"
            failed=1
          fi
          if [[ "${{ steps.wood_joint_candidate.outcome }}" != "success" ]]; then
            echo "Wood-joint-candidate gate: ${{ steps.wood_joint_candidate.outcome }}"
            failed=1
          fi
          exit "$failed"
