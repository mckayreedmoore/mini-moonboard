name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      include_historical:
        description: Also test preserved historical models and V1 exports
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: |
          uv python install
          uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest ${{ inputs.include_historical && '--include-historical' || '' }}
      - name: Smoke-test CadQuery
        run: uv run scripts/smoke_test.py
      - name: Rebuild and verify the current candidate
        run: uv run python -m scripts.clear_space_exports floor --check
      - name: Verify historical reference/V1 exports
        if: ${{ inputs.include_historical }}
        run: |
          uv run python -m mini_moonboard.export
          git diff --exit-code -- exports
