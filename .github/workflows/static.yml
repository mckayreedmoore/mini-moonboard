name: Deploy interactive CAD viewer

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run python -c "from pathlib import Path; from mini_moonboard.export import export_v1_viewer_mesh; export_v1_viewer_mesh(Path('site'))"
      - run: uv run python -c "from pathlib import Path; from mini_moonboard.hybrid_exports import viewer_mesh; [viewer_mesh(size, Path('site')) for size in ('2x10', '2x12', '2x8-shallow', '2x8-foot100')]"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
